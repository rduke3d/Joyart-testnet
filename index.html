<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyart AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* RESET PARA QUE NO TE CAGUE EL CSS VIEJO */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
    a { color: #fff; text-decoration: none; }
    
    /* NAVBAR */
    .navbar { position: fixed; top: 0; width: 100%; background: #0a0a0a; border-bottom: 1px solid #222; z-index: 9999; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 20px; }
    .logo-text { font-size: 24px; font-weight: 700; }
    .logo-badge { background: #CD7F32; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 5px; }
    
    .nav-menu { display: flex; gap: 30px; }
    .nav-link { font-size: 14px; }
    .nav-actions { display: flex; gap: 10px; }
    
    .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-bronze { background: #CD7F32; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #444; color: #fff; }
    
    .hamburger-btn { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

    /* SECCIONES DE EJEMPLO PARA QUE NO SALGA NEGRO */
    .section { padding: 120px 20px 80px; text-align: center; min-height: 100vh; }
    .hero-title { font-size: 40px; margin-bottom: 20px; }
    .text-rose-gold { color: #B76E79; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .hamburger-btn { display: block !important; }
      .nav-menu { 
        display: none; 
        position: absolute; 
        top: 70px; 
        left: 0; 
        width: 100%; 
        background: #111; 
        flex-direction: column; 
        padding: 20px; 
        gap: 20px; 
      }
      .nav-menu.active { display: flex !important; }
      .nav-actions .btn { display: none !important; }
      .nav-menu .mobile-btn { display: block; width: 100%; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="nav-logo"><span class="logo-text">joyart</span><span class="logo-badge">AI</span></a>
      
      <nav class="nav-menu" id="nav-menu">
        <a href="#soluciones" class="nav-link">SOLUCIONES</a>
        <a href="#modelos" class="nav-link">MODELOS</a>
        <button class="btn btn-bronze mobile-btn btn-probar">Probar Joyart</button>
        <button class="btn btn-outline mobile-btn btn-app">Abrir App</button>
      </nav>
      
      <div class="nav-actions">
        <button class="btn btn-bronze btn-probar">Probar Joyart</button>
        <button class="btn btn-outline btn-app">Abrir App</button>
        <button class="hamburger-btn" id="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <section class="section" id="hero">
    <h1 class="hero-title">Una Visión. Tres Motores. <br><span class="text-rose-gold">Únete al Testnet de Joyart</span></h1>
    <button class="btn btn-bronze btn-probar">Adquirir Joyart AI</button>
  </section>

  <section class="section" id="soluciones"><h2>SOLUCIONES</h2></section>

<!-- MODAL -->
<div id="modal-joyart" onclick="cerrarSiClickAfuera(event)" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99999; justify-content:center; align-items:center;">
  <div onclick="event.stopPropagation()" style="background:#111; padding:40px; border-radius:16px; max-width:420px;">
    <button id="cerrar-modal" style="float:right; background:none; border:none; color:#666; font-size:24px; cursor:pointer;">x</button>
    <h3>Acceso al Testnet</h3>
    <form id="form-demo">
      <input type="email" name="email" placeholder="tu@correo.com" required style="width:100%; padding:14px; margin:20px 0; background:#222; border:1px solid #444; color:#fff;">
      <button type="submit" id="btn-enviar" class="btn btn-bronze" style="width:100%;">Solicitar Demo</button>
    </form>
  </div>
</div>

<script>
// JS SIMPLE SIN DEPENDENCIAS
document.addEventListener('DOMContentLoaded', function() {
  const navMenu = document.getElementById('nav-menu');
  
  // HAMBURGUESA
  document.getElementById('hamburger-btn').onclick = () => navMenu.classList.toggle('active');
  
  // MODAL
  function abrirModal() {
    document.getElementById('modal-joyart').style.display = 'flex';
    navMenu.classList.remove('active');
  }
  function cerrarModal() {
    document.getElementById('modal-joyart').style.display = 'none';
  }
  window.cerrarSiClickAfuera = (e) => { if(e.target.id === 'modal-joyart') cerrarModal(); }
  
  document.querySelectorAll('.btn-probar, .btn-app').forEach(btn => btn.onclick = abrirModal);
  document.getElementById('cerrar-modal').onclick = cerrarModal;
  
  // FORM
  document.getElementById('form-demo').onsubmit = (e) => {
    e.preventDefault();
    alert('Demo enviada!'); // temporal para probar
    cerrarModal();
  }
});
</script>
</body>
</html>
