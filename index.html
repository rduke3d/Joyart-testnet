<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyart AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0a0a0a; color: #fff; }
    
    /* NAVBAR */
    .navbar { position: fixed; top: 0; width: 100%; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #222; z-index: 10000; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 20px; }
    .logo-text { font-size: 24px; font-weight: 700; } .logo-badge { background: #CD7F32; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 5px; }
    .nav-menu { display: flex; gap: 30px; align-items: center; }
    .nav-link { color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; }
    .nav-actions { display: flex; gap: 10px; }
    .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn-bronze { background: #CD7F32; color: #fff; } .btn-outline { background: transparent; border: 1px solid #444; color: #fff; } .btn-white { background: #fff; color: #000; }
    .hamburger-btn { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

    /* SECCIONES */
    .section { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 100px 20px; }
    .hero-bg-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
    .hero-bg-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
    .hero-title { font-size: 48px; font-weight: 700; line-height: 1.2; margin-bottom: 20px; }
    .text-rose-gold { color: #B76E79; }
    .hero-subtitle { font-size: 18px; color: #aaa; max-width: 600px; margin: 0 auto 30px; }

    /* RESPONSIVE */
    @media (max-width: 990px) {
      .hamburger-btn { display: block !important; }
      .nav-menu { 
        display: none; 
        position: fixed !important; 
        top: 80px; left: 0; width: 100%; 
        background: #0a0a0a !important; 
        flex-direction: column; 
        padding: 30px 20px; 
        gap: 20px; 
        border-top: 1px solid #222;
      }
      .nav-menu.active { display: flex !important; }
      .nav-actions .btn { display: none !important; }
      .nav-menu .mobile-btn { display: block !important; width: 100%; padding: 16px; }
      .hero-title { font-size: 32px; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="nav-logo" style="text-decoration:none; color:#fff;"><span class="logo-text">joyart</span><span class="logo-badge">AI</span></a>
      <nav class="nav-menu" id="nav-menu">
        <a href="#soluciones" class="nav-link">SOLUCIONES</a>
        <a href="#modelos" class="nav-link">MODELOS</a>
        <button class="btn btn-bronze mobile-btn btn-probar">Probar Joyart</button>
        <button class="btn btn-outline mobile-btn btn-app">Abrir App</button>
      </nav>
      <div class="nav-actions">
        <button class="btn btn-bronze btn-probar">Probar Joyart</button>
        <button class="btn btn-outline btn-app">Abrir App</button>
        <button class="hamburger-btn" id="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <section class="section" id="hero">
    <div class="hero-bg-wrapper">
      <img src="Seccion1.png" alt="Hero" class="hero-bg-img" onerror="this.style.display='none'">
    </div>
    <div>
      <h1 class="hero-title">Una Visión. Tres Motores. <br><span class="text-rose-gold">Únete al Testnet de Joyart</span></h1>
      <p class="hero-subtitle">La infraestructura de automatización con IA más rápida y elegante del mercado.</p>
      <button class="btn btn-white btn-probar">Adquirir Joyart AI</button>
    </div>
  </section>

  <section class="section" id="soluciones" style="background:#111;">
    <div>
      <h2 style="font-size:40px;">Tres Soluciones Operativas</h2>
      <p style="color:#aaa; margin-top:20px;">AI - Automation - CRM</p>
    </div>
  </section>

<!-- MODAL -->
<div id="modal-joyart" onclick="cerrarSiClickAfuera(event)" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99999; justify-content:center; align-items:center;">
  <div onclick="event.stopPropagation()" style="background:#111; padding:40px; border-radius:16px; max-width:420px;">
    <button id="cerrar-modal" style="float:right; background:none; border:none; color:#666; font-size:24px; cursor:pointer;">x</button>
    <h3>Acceso al Testnet</h3>
    <input type="email" id="user-email" placeholder="tu@correo.com" style="width:100%; padding:14px; margin:20px 0; background:#222; border:1px solid #444; color:#fff;">
    <button id="btn-enviar" class="btn btn-bronze" style="width:100%;">Solicitar Demo</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const navMenu = document.getElementById('nav-menu');
  
  // HAMBURGUESA
  document.getElementById('hamburger-btn').addEventListener('click', () => {
    navMenu.classList.toggle('active');
    console.log('click hamburguesa'); // para debug
  });
  
  // MODAL
  function abrirModal() {
    document.getElementById('modal-joyart').style.display = 'flex';
    navMenu.classList.remove('active');
  }
  function cerrarModal() {
    document.getElementById('modal-joyart').style.display = 'none';
  }
  window.cerrarSiClickAfuera = (e) => { if(e.target.id === 'modal-joyart') cerrarModal(); }
  
  document.querySelectorAll('.btn-probar, .btn-app').forEach(btn => btn.onclick = abrirModal);
  document.getElementById('cerrar-modal').onclick = cerrarModal;
  
  // FORM
  document.getElementById('btn-enviar').onclick = () => {
    alert('Demo enviada a: ' + document.getElementById('user-email').value);
    cerrarModal();
  }
});
</script>
</body>
</html>
